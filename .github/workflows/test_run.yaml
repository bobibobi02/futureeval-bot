name: Test run (dry run, nothing is published)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Dry run on 3 public questions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: python main.py --mode test_questions --dry-run
