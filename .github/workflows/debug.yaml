name: Debug Metaculus API

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: Query API
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: python debug.py
